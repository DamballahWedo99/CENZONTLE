services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cenzontle
      POSTGRES_PASSWORD: cenzontle_dev
      POSTGRES_DB: cenzontle
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cenzontle
      MINIO_ROOT_PASSWORD: cenzontle_dev
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 cenzontle cenzontle_dev;
      mc mb local/cenzontle-documents --ignore-existing;
      mc anonymous set download local/cenzontle-documents;
      "

volumes:
  pgdata:
  minio_data:
