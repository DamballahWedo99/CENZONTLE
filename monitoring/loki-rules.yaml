# ─────────────────────────────────────────────────────────────────────────────
# Loki — alerting rules for the CENZONTLE API
# ─────────────────────────────────────────────────────────────────────────────
#
# Format: Prometheus-style alerting rules for Loki's RULER. The same format is
# accepted by Grafana (managed alerts over a Loki datasource), Grafana Cloud and
# Grafana Mimir — so this rule works whichever path you take.
#
# How to load it, depending on your setup:
#   • Self-hosted Loki with a ruler → mount this file in the ruler's rule
#     directory (`ruler.storage` local / `-ruler.rule-path`) and reload Loki.
#   • Grafana (UI)                  → Alerting → New alert rule → Loki
#     datasource, then copy the `expr`, `for`, `labels` and `annotations` below.
#
# ⚠️  ADJUST the stream selector `{service="cenzontle-api"}` to the label your
#     log pipeline (Promtail / Grafana Alloy / your platform's shipper) actually
#     puts on the API's logs. It may be `app`, `container`, `job`, `namespace`,
#     etc. — this repo ships no shipper config, so the selector below is a
#     reasonable placeholder, not a real value.
#
# Context: the API logs JSON (pino, see app.module.ts). The rate limiter uses
# `ResilientThrottlerStorage`, which emits a `warn` when it loses Redis and falls
# back to FAIL-OPEN mode — the rate-limiting caps are DISABLED (requests pass
# unthrottled) until Redis comes back. This alert makes that degradation of a
# security control visible and actionable, instead of a log nobody reads. The log
# is already rate-limited to 1 line / 30s on the app side.

groups:
  - name: cenzontle-api-rate-limiter
    rules:
      - alert: RateLimiterFailOpen
        # Counts the lines containing "FAIL-OPEN" over the last 5m. That string
        # is unique to the `ResilientThrottlerStorage.noteDegraded()` log, so the
        # `|= "FAIL-OPEN"` line filter is enough without parsing the JSON.
        # A more precise variant (optional), if your pipeline keeps the JSON:
        #   {service="cenzontle-api"} | json | context = "ResilientThrottlerStorage"
        expr: |
          sum(count_over_time({service="cenzontle-api"} |= "FAIL-OPEN" [5m])) > 0
        # `for: 0m` — alert as soon as the first line shows up. A security
        # control that is down, even briefly, is worth a notification; the log's
        # own rate limit (1/30s) already prevents spam. If the team finds this
        # noisy for sub-30s blips, raising the threshold to `> 1` requires
        # sustained degradation.
        for: 0m
        labels:
          severity: warning
          component: rate-limiter
          service: cenzontle-api
        annotations:
          summary: "CENZONTLE API rate limiter is in FAIL-OPEN mode"
          description: >-
            ResilientThrottlerStorage cannot reach Redis: rate limiting is
            temporarily DISABLED — requests pass unthrottled, including the
            anti-brute-force cap on login. The API keeps serving normally
            (fail-open is by design). Action: check Redis health (REDIS_HOST /
            REDIS_PORT) and the API's connectivity; once Redis is back the caps
            re-arm on their own, with no redeploy. The alert auto-resolves ~5m
            after the last FAIL-OPEN line.
