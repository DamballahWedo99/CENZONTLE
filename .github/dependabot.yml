version: 2

updates:
  # npm/pnpm dependencies. Dependabot understands pnpm workspaces from the root,
  # so a single block covers apps/* and packages/*.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "Chore"
      include: "scope"
    groups:
      # Patches and minors grouped into one PR: less noise, and they almost never break.
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Majors of these set the pace of the whole monorepo and get bumped by hand,
      # together with the code changes they imply.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "turbo"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "Chore"
