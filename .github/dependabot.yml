version: 2

updates:
  # Dependencias de npm/pnpm. Dependabot entiende pnpm workspaces desde la raíz,
  # así que un solo bloque cubre apps/* y packages/*.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "Chore"
      include: "scope"
    groups:
      # Los parches y minors agrupados en un PR: reducen ruido y casi nunca rompen.
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Los majors de estos marcan el ritmo del monorepo entero y se suben a mano,
      # coordinando el cambio de código que implican.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "turbo"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "Chore"
