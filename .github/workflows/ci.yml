name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One live run per branch: consecutive pushes to the same PR cancel the previous
# run instead of queueing up. Inside a PR `github.ref` is `refs/pull/<n>/merge`,
# so two different PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # The `postinstall` of apps/api runs `prisma generate`, which loads
  # `prisma.config.ts`; that file resolves DATABASE_URL strictly and aborts when
  # it is missing, so without this variable `pnpm install` fails in all three
  # jobs. Generating the client opens no connection and CI brings up no
  # database: this value only has to exist and be a valid postgres URL.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

jobs:
  verify:
    name: Types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # Two things here are not obvious:
      #   - The Node version comes from `.nvmrc` (Node 22) so that CI and the
      #     developer's machine cannot drift apart unnoticed.
      #   - `cache: pnpm` resolves the store by calling the pnpm binary, so this
      #     step has to come AFTER action-setup, not before.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # All three turbo tasks declare `dependsOn: ["^build"]`, so packages/shared
      # builds itself before each of them. No extra step is needed to build it by
      # hand.
      - name: Type-check
        run: pnpm type-check

      # Jest in apps/api + Vitest in apps/web and apps/worker. The Playwright e2e
      # tests hang off a different script (`test:e2e`) and deliberately do not run
      # here: they need the app up and a browser.
      - name: Tests
        run: pnpm test

  # Lint gets its own job on purpose: turbo aborts the run at the first failing
  # task, so a broken lint inside `verify` would hide the signal from the tests.
  # Split apart, each signal reads on its own and both jobs run in parallel. (That
  # same cascade effect kept the repo's lint debt hidden for months: 2 errors in
  # `worker` hid 53 in `api`, which in turn hid 101 in `web`.)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A separate job from `verify` and with no `needs:`: it runs in parallel, so
      # a compile error doesn't wait for the tests to finish before showing up.
      - name: Build
        run: pnpm build
