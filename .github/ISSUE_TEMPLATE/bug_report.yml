name: 🐛 Bug report
description: Something doesn't work the way it should
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before you go on:

        - If the problem is a **security vulnerability**, **don't open a public issue** —
          follow [SECURITY.md](../blob/main/SECURITY.md).
        - If it's a startup failure, read
          [docs/troubleshooting.md](../blob/main/docs/troubleshooting.md) first: it covers
          the most common setup failures.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you report
      options:
        - label: I searched the existing issues and didn't find this problem
          required: true
        - label: I read `docs/troubleshooting.md`
          required: true
        - label: This is **not** a security vulnerability
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - "apps/web (Next.js frontend)"
        - "apps/api (NestJS backend)"
        - "apps/worker (Forge fleet)"
        - "packages/shared (shared types)"
        - "Setup / installation / Docker"
        - "Documentation"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the behavior you observed. Include the full error message if there is one.
      placeholder: |
        Running `pnpm dev`, the API starts but the frontend returns 503 on /proyectos...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: As specific as you can make it. A repro we can run beats a long description.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Paste the output of:
        ```
        node --version && pnpm --version && docker --version && git rev-parse --short HEAD
        ```
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        **Check that they carry no secrets** before you paste them — tokens,
        `VAULT_ENCRYPTION_KEY`, Anthropic keys, Auth0 keys. Redact them.
      render: shell
    validations:
      required: false
