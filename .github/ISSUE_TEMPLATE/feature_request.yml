name: ✨ Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals that describe **the problem** before the solution get a much better
        reception. If you already have an implementation in mind, even better — say so.

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the concrete situation that is awkward, slow, or impossible today.
      placeholder: |
        When a worker loses its connection halfway through a story, there's no way to
        tell where it got to without SSHing into the machine...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. If you have several options, name them.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - "apps/web (frontend)"
        - "apps/api (backend)"
        - "apps/worker (Forge)"
        - "packages/shared"
        - "Documentation"
        - "Tooling / CI"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Include "do nothing" if it applies — sometimes it's the right answer.
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - label: I'm willing to open a PR for this
          required: false
